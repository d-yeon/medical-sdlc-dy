<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .axis { stroke: #333; stroke-width: 1; }
    .bar { fill: #3b7ddd; }
    .barMulti { fill: #e07b39; }
    .label { font-size: 11px; fill: #222; }
    .title { font-size: 15px; fill: #111; font-weight: bold; }
    .sub { font-size: 12px; fill: #444; }
  </style>
  <text x="20" y="24" class="title">Findings label frequency (n=272 studies) &amp; multi- vs single-label split</text>
  <text x="20" y="42" class="sub">Left: individual finding labels (pipe-split, may co-occur). Right: single- vs multi-finding report split.</text>

  <!-- Left panel: individual label bar chart -->
  <!-- data: No Finding 145, Infiltration 45, Effusion 33, Atelectasis 32, Fibrosis 13, Nodule 12, Pneumothorax 12, Cardiomegaly 10, Pleural_Thickening 9, Emphysema 9 (top10) -->
  <g transform="translate(60,60)">
    <line x1="0" y1="0" x2="0" y2="260" class="axis"/>
    <line x1="0" y1="260" x2="380" y2="260" class="axis"/>
    <text x="-45" y="-6" class="label">count</text>
    <!-- y ticks -->
    <text x="-28" y="264" class="label">0</text>
    <text x="-34" y="118" class="label">75</text>
    <text x="-38" y="4" class="label">150</text>
    <line x1="0" y1="4" x2="380" y2="4" stroke="#ddd" stroke-width="1"/>
    <line x1="0" y1="118" x2="380" y2="118" stroke="#ddd" stroke-width="1"/>

    <!-- bars: max value 145 -> scale 260/150 ~1.73 px per count -->
    <!-- No Finding 145 -->
    <rect x="5" y="8" width="26" height="252" class="bar"/>
    <text x="4" y="270" class="label" transform="rotate(45,4,270)">No Finding</text>
    <text x="2" y="4" class="label">145</text>

    <!-- Infiltration 45 -->
    <rect x="41" y="182" width="26" height="78" class="bar"/>
    <text x="40" y="270" class="label" transform="rotate(45,40,270)">Infiltration</text>
    <text x="38" y="178" class="label">45</text>

    <!-- Effusion 33 -->
    <rect x="77" y="203" width="26" height="57" class="bar"/>
    <text x="76" y="270" class="label" transform="rotate(45,76,270)">Effusion</text>
    <text x="74" y="199" class="label">33</text>

    <!-- Atelectasis 32 -->
    <rect x="113" y="205" width="26" height="55" class="bar"/>
    <text x="112" y="270" class="label" transform="rotate(45,112,270)">Atelectasis</text>
    <text x="110" y="201" class="label">32</text>

    <!-- Fibrosis 13 -->
    <rect x="149" y="237" width="26" height="23" class="bar"/>
    <text x="148" y="270" class="label" transform="rotate(45,148,270)">Fibrosis</text>
    <text x="146" y="233" class="label">13</text>

    <!-- Nodule 12 -->
    <rect x="185" y="239" width="26" height="21" class="bar"/>
    <text x="184" y="270" class="label" transform="rotate(45,184,270)">Nodule</text>
    <text x="182" y="235" class="label">12</text>

    <!-- Pneumothorax 12 -->
    <rect x="221" y="239" width="26" height="21" class="bar"/>
    <text x="220" y="270" class="label" transform="rotate(45,220,270)">Pneumothorax</text>
    <text x="218" y="235" class="label">12</text>

    <!-- Cardiomegaly 10 -->
    <rect x="257" y="243" width="26" height="17" class="bar"/>
    <text x="256" y="270" class="label" transform="rotate(45,256,270)">Cardiomegaly</text>
    <text x="254" y="239" class="label">10</text>

    <!-- Pleural_Thickening 9 -->
    <rect x="293" y="245" width="26" height="15" class="bar"/>
    <text x="292" y="270" class="label" transform="rotate(45,292,270)">Pl.Thickening</text>
    <text x="290" y="241" class="label">9</text>

    <!-- Emphysema 9 -->
    <rect x="329" y="245" width="26" height="15" class="bar"/>
    <text x="328" y="270" class="label" transform="rotate(45,328,270)">Emphysema</text>
    <text x="326" y="241" class="label">9</text>
  </g>

  <!-- Right panel: single vs multi finding studies (pie-like stacked bar) -->
  <g transform="translate(500,60)">
    <text x="0" y="-6" class="sub">Studies by label count (n=272)</text>
    <line x1="0" y1="0" x2="0" y2="260" class="axis"/>
    <line x1="0" y1="260" x2="160" y2="260" class="axis"/>
    <!-- single-label 222 (81.6%), multi-label 50 (18.4%) -->
    <rect x="30" y="260" y2="0" width="60" height="221" class="bar" transform="translate(0,-221)"/>
    <rect x="30" y="221" width="60" height="39" class="barMulti" transform="translate(0,0)"/>
    <text x="15" y="255" class="label">222</text>
    <text x="15" y="230" class="label">50</text>
    <text x="10" y="278" class="label">single / multi</text>
    <rect x="0" y="-20" width="10" height="10" class="bar"/>
    <text x="14" y="-11" class="label">single-label (222, 81.6%)</text>
    <rect x="0" y="-4" width="10" height="10" class="barMulti"/>
    <text x="14" y="5" class="label">multi-label (50, 18.4%)</text>
  </g>

  <text x="20" y="400" class="sub">Source: llm.hospital, findings_label split on "|" (query-medical-db). 272 studies / 153 patients.</text>
</svg>
